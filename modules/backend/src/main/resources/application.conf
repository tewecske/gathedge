app {
  env = "dev"
  env = ${?APP_ENV}
  server-host = "0.0.0.0"
  server-host = ${?SERVER_HOST}
  server-port = 8080
  server-port = ${?SERVER_PORT}
  public-base-url = "http://localhost:5173"
  public-base-url = ${?PUBLIC_BASE_URL}
  # Off by default: a verification link is still sent and still works, but an unverified
  # account can still sign in. Switching this on refuses password logins until the link is
  # followed, and (in production) requires smtp.host to be set.
  require-email-verification = false
  require-email-verification = ${?REQUIRE_EMAIL_VERIFICATION}
  # How many reverse proxies sit in front of this server. 0 (the default, and what `npm run dev`
  # wants) means X-Forwarded-For is ignored entirely and the socket peer is the client. Set it to
  # the number of proxies you actually run — the compose stack sets 1 for its nginx — and no more:
  # each hop you claim is one entry of the header you are choosing to believe.
  trusted-proxy-hops = 0
  trusted-proxy-hops = ${?TRUSTED_PROXY_HOPS}
  # How long a row in `login_attempts` is kept. Every sign-in attempt writes one, including the ones
  # the rate limiter refuses before checking a password, so an unauthenticated caller decides how
  # fast this table grows — it is the only table in the schema that does not need an account first.
  # The reaper deletes past this age; `audit_log` is deliberately not swept, being the record of
  # what administrators did.
  login-attempt-retention-days = 30
  login-attempt-retention-days = ${?LOGIN_ATTEMPT_RETENTION_DAYS}
  # How long an *empty* guest account is kept — one minted for a visitor who then tagged nothing.
  # A guest holding words is never swept however old it is: it has no address to be recovered by,
  # but its transfer code may be written down somewhere.
  guest-retention-days = 7
  guest-retention-days = ${?GUEST_RETENTION_DAYS}
  # How long a "forgot password" link stays redeemable. Shorter than the verification link's 24 hours
  # on purpose: this one grants a new password outright, not just a proof of address.
  password-reset-token-validity-hours = 6
  password-reset-token-validity-hours = ${?PASSWORD_RESET_TOKEN_VALIDITY_HOURS}
}

db {
  url = "jdbc:postgresql://localhost:5432/gathedge"
  url = ${?DB_URL}
  user = "gathedge"
  user = ${?DB_USER}
  password = "gathedge"
  password = ${?DB_PASSWORD}
  # The Postgres schema this application owns. Flyway creates it if it is missing and puts its own
  # flyway_schema_history in it; the connection pool sets it as each connection's search_path, which
  # is what makes the unqualified table names in every repository resolve here. One setting, two
  # readers — they must never be pointed at different schemas. Owning a schema is what lets this app
  # share a database with another without colliding, and makes "drop everything it owns" one
  # statement. Set it to "public" to reproduce the layout from before there was a schema at all.
  schema = "gathedge"
  schema = ${?DB_SCHEMA}
}

session {
  cookie-secure = false
  cookie-secure = ${?SESSION_COOKIE_SECURE}
}

bootstrap-admin {
  email = "admin@example.com"
  email = ${?BOOTSTRAP_ADMIN_EMAIL}
  password = "changeme123"
  password = ${?BOOTSTRAP_ADMIN_PASSWORD}
}

oauth {
  google {
    client-id = ""
    client-id = ${?GOOGLE_CLIENT_ID}
    client-secret = ""
    client-secret = ${?GOOGLE_CLIENT_SECRET}
    redirect-uri = "http://localhost:8080/api/auth/google/callback"
    redirect-uri = ${?GOOGLE_REDIRECT_URI}
  }

  microsoft {
    client-id = ""
    client-id = ${?MICROSOFT_CLIENT_ID}
    client-secret = ""
    client-secret = ${?MICROSOFT_CLIENT_SECRET}
    redirect-uri = "http://localhost:8080/api/auth/microsoft/callback"
    redirect-uri = ${?MICROSOFT_REDIRECT_URI}
    # "common" admits both work/school (Entra ID) and personal Microsoft accounts. Use a tenant
    # GUID to restrict sign-in to one organisation.
    tenant = "common"
    tenant = ${?MICROSOFT_TENANT}
  }
}

mail {
  from = "no-reply@localhost"
  from = ${?MAIL_FROM}

  smtp {
    # Empty host = no mail server: outgoing mail is logged instead of sent.
    host = ""
    host = ${?SMTP_HOST}
    port = 587
    port = ${?SMTP_PORT}
    username = ""
    username = ${?SMTP_USERNAME}
    password = ""
    password = ${?SMTP_PASSWORD}
    start-tls = true
    start-tls = ${?SMTP_START_TLS}
  }
}

captcha {
  # Cloudflare Turnstile. Both halves empty = the feature is off: no widget renders and the
  # guarded endpoints skip verification. `site-key` is public (the browser needs it); `secret`
  # must stay server-side. Free keys at https://dash.cloudflare.com -> Turnstile.
  site-key = ""
  site-key = ${?CAPTCHA_SITE_KEY}
  secret = ""
  secret = ${?CAPTCHA_SECRET}
  # How many failed sign-in attempts one client address may make before the sign-in form demands
  # a captcha. Below the rate limiter's hard lockout of 5, so a human gets a challenge before a
  # bot is hard-blocked.
  login-threshold = 2
  login-threshold = ${?CAPTCHA_LOGIN_THRESHOLD}
}

netty {
  # 0 lets Netty size the event loop group itself (2x available processors).
  max-threads = 0
  max-threads = ${?NETTY_MAX_THREADS}
}

quotas {
  # Two independent standing per-account caps on the vocabulary: how many tags one account may own,
  # and how many word_tag_pairs rows it may own summed across every tag it holds (one marked
  # translation is two rows, one per direction). Each has a soft threshold, which only warns, and a
  # hard one, which blocks — see WordService.checkQuota.
  tags-per-user-soft = 20
  tags-per-user-soft = ${?TAGS_PER_USER_SOFT_LIMIT}
  tags-per-user-hard = 50
  tags-per-user-hard = ${?TAGS_PER_USER_HARD_LIMIT}
  word-pairs-per-user-soft = 500
  word-pairs-per-user-soft = ${?WORD_PAIRS_PER_USER_SOFT_LIMIT}
  word-pairs-per-user-hard = 2000
  word-pairs-per-user-hard = ${?WORD_PAIRS_PER_USER_HARD_LIMIT}
}
