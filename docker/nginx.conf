server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are small (JSON APIs only); keep the ceiling low.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The SPA is same-origin with the API on purpose: the backend has no CORS middleware,
    # and its CSRF defence is the X-Requested-With header, which a cross-origin page could
    # not set without a preflight. Everything under /api goes to the backend unchanged.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        # One header, not `expires` + add_header — that emits two Cache-Control lines.
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # Waypoint routes with the HTML5 history API: any unknown path is a client-side route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
